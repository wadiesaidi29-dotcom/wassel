services:
  - type: web
    name: wassel-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false   # tu la colles toi-même dans le dashboard Render (jamais dans le code)
      - key: PYTHON_VERSION
        value: 3.13.0
